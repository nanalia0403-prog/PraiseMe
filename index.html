let mode='suffix',score=0,streak=0,total=0,correct=0,current=null,answered=false; const mastered=new Set(JSON.parse(localStorage.getItem('decoderMastered')||'[]'));
const $=s=>document.querySelector(s), stage=$('#stage');
const cats=[...new Set(drugs.map(d=>d.category))].sort(); cats.forEach(c=>$('#category').insertAdjacentHTML('beforeend',`<option>${c}</option>`));
function filtered(){let c=$('#category').value;return c==='all'?drugs:drugs.filter(d=>d.category===c)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}
function findRule(d){let g=(d.generic||'').toLowerCase().replace(/[^a-z]/g,'');return rules.find(r=>new RegExp(r.regex,'i').test(g))}
function opts(correct, pool){return shuffle([correct,...shuffle([...new Set(pool.filter(x=>x!==correct))]).slice(0,3)])}
function update(){$('#score').textContent=score;$('#streak').textContent=streak;$('#acc').textContent=total?Math.round(correct/total*100)+'%':'0%';$('#mastered').textContent=mastered.size;$('#bar').style.width=Math.min(100,(mastered.size/rules.length*100))+'%'}
function choose(q){document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(b,b.dataset.v===q.correct,q))}
function answer(btn,ok,q){if(answered)return;answered=true;total++;btn.classList.add(ok?'good':'bad');if(ok){correct++;streak++;score+=10+Math.min(streak,10);if(q.rule){mastered.add(q.rule.pattern);localStorage.setItem('decoderMastered',JSON.stringify([...mastered]))}}else{streak=0;score=Math.max(0,score-2);document.querySelectorAll('.option').forEach(x=>{if(x.dataset.v===q.correct)x.classList.add('good')})}update();stage.insertAdjacentHTML('beforeend',teachHTML(q,ok));}
function teachHTML(q,ok){let d=q.drug,r=q.rule,h=q.hook;let chain=r?`<div class="chain"><span class="node">${r.pattern}</span><span class="arrow">→</span><span class="node">${r.class}</span><span class="arrow">→</span><span class="node">${r.indication}</span></div>`:'';return `<div class="teach"><h3>${ok?'✅ 破解成功':'🧠 正确拆解'}</h3>${chain}<p><b>为什么：</b>${r?r.hook:'这个药没有稳定的家族字尾，要靠专属品牌联想。'}</p>${h?`<p><b>品牌 ↔ 学名：</b>${h.split} → ${h.bridge}<br><b>记忆句：</b>${h.memory}</p>`:`<p><b>品牌 ↔ 学名：</b>${d.brand} → ${d.generic}</p>`}<p><b>代表适应症：</b>${d.indication}</p></div>`}
